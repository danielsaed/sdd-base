# Minimal CI for the workflow itself. Add your project's jobs (type check, lint, tests,
# build) below `workflow` — the agents' Verification list in AGENTS.md should match them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Docs within their line limits: a doc that grows unchecked stops being read.
      - name: Docs within their limits
        run: node scripts/check-docs.mjs
      # Agent permissions (guard self-test: cases + mutation per rule) and closeout rules
      # still hold. A broken guard blocks every agent or lets through push/shared changes.
      - name: Hooks self-test
        run: bash scripts/test-hooks.sh
      # scripts/pr_wait.sh against a fake `gh`: never merges without --merge, nor with a
      # red/cancelled/checkless CI either; the summary stays 1 line.
      - name: pr_wait.sh self-test
        run: bash scripts/verify/pr_wait_selftest.sh
